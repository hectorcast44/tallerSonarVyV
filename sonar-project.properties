# ==============================================================================
# SonarQube Cloud Configuration (React + NestJS Monorepo)
# ==============================================================================

# Clave única y organización en SonarQube Cloud
# NOTA: Reemplazar con los valores exactos creados en sonarcloud.io
sonar.organization=hectorcast44
sonar.projectKey=hectorcast44_tallerSonarVyV

sonar.projectName=Taller V&V - React + NestJS
sonar.projectVersion=1.0

# Rutas de código fuente a escanear (Client y Server)
sonar.sources=client/src,server/src

# Rutas donde residen las pruebas
sonar.tests=client/src,server/src

# Inclusiones para que Sonar sepa qué archivos son pruebas unitarias
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx

# Archivos y carpetas excluidas del análisis de calidad
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,client/src/main.tsx,client/src/setupTests.ts,server/src/main.ts

# Rutas de los reportes LCOV de cobertura (separadas por comas)
# Ambos proyectos generan 'lcov.info' al ejecutar npm run test:cov
sonar.javascript.lcov.reportPaths=client/coverage/lcov.info,server/coverage/lcov.info

# Codificación de caracteres estándar
sonar.sourceEncoding=UTF-8
